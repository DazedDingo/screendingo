name: screenshots-real (Play Store)

# Production-grade screenshot capture pipeline.
#
# Pre-seeds a curated test household into real Firestore via
# firebase-admin, mints a Firebase custom token for the seeded uid, builds
# a debug APK (real Firebase config — NO DEMO_MODE) with the token baked
# in via `--dart-define=AUTO_SIGN_IN_TOKEN=...`, boots a Pixel emulator,
# launches the app, captures progressive screenshots.
#
# Compared to screenshots.yml (DEMO_MODE pipeline validation):
#   - Real Firebase config from secret (not placeholder JSON)
#   - Real TMDB key (so posters + ratings + reviews load)
#   - signInWithCustomToken auto-auth (no Google Sign-In UI to drive)
#   - Real Cloud Functions + Firestore reads — exercises every code path
#     the production app exercises, end-to-end
#
# Required secrets (only FIREBASE_SERVICE_ACCOUNT_JSON is new — the other
# three are reused from the existing release.yml / release-aab.yml flows):
#   GOOGLE_SERVICES_JSON          — RAW (not base64) contents of
#                                   android/app/google-services.json from
#                                   Firebase console. Already used by the
#                                   APK + AAB release workflows.
#   FIREBASE_SERVICE_ACCOUNT_JSON — NEW. Raw JSON contents of a service
#                                   account with "Firebase Auth Admin" +
#                                   "Cloud Datastore User" (or higher);
#                                   minted via console.firebase.google.com
#                                   → Project Settings → Service accounts.
#                                   No trailing newline (same rule as
#                                   gotcha 35b in CLAUDE.md — JSON.parse
#                                   tolerates it, but cleaner is safer).
#   TMDB_API_KEY                  — same key the app uses in production.
#   TRAKT_CLIENT_ID               — same client id the app uses in
#                                   production. Only required by the
#                                   build's startup validation, not by
#                                   any read path the screenshot run
#                                   exercises.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write  # upload artifact

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore google-services.json from secret
        # Reuses the same RAW (not base64) GOOGLE_SERVICES_JSON secret
        # that release.yml + release-aab.yml use — see file header.
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          # Cheap sanity check — if the secret was empty or malformed,
          # fail fast with a clear message rather than letting the
          # Android build choke 5 minutes later.
          python3 -c "import json,sys; json.load(open('android/app/google-services.json')); print('google-services.json OK')"

      - name: Generate throwaway debug keystore
        # Custom-token sign-in bypasses Google Sign-In's SHA-1 cert check,
        # so we don't need the registered debug keystore here — a fresh
        # one with the canonical alias/password is enough to satisfy
        # validateSigningDebug. Saves a secret + a restore step.
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Cloud Functions deps (for seeder + token mint)
        working-directory: functions
        run: npm ci

      - name: Seed screenshot test household into Firestore
        # Idempotent — re-running overwrites the same docs. We re-seed on
        # every CI run so the relative timestamps (lastWatchedAt, ratedAt,
        # addedAt) stay fresh; the rendered "Watched 2 days ago" / "Rated
        # last week" copy on the screenshots tracks wall-clock time, so
        # the seed has to track it too.
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          npx ts-node scripts/screenshots_setup.ts seed

      - name: Mint custom auth token for the seeded household
        id: mint
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          TOKEN=$(npx ts-node scripts/screenshots_setup.ts mint-token)
          if [ -z "$TOKEN" ]; then
            echo "::error::Token mint produced empty output"
            exit 1
          fi
          # Mask the token in logs so it never leaks via accidental echo.
          echo "::add-mask::$TOKEN"
          # Hand off to the build step. GitHub Actions step outputs are
          # the safest transport for sensitive values between steps;
          # multi-line tokens are fine via the < <(printf) form.
          {
            echo "token<<EOF_TOKEN"
            printf '%s' "$TOKEN"
            echo
            echo "EOF_TOKEN"
          } >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build debug APK with AUTO_SIGN_IN_TOKEN
        # No DEMO_MODE — this is a real-Firebase build. The token plumbed
        # through dart-define lets main.dart auto-sign-in immediately
        # after App Check activation, so the emulator never has to see
        # the Google Sign-In UI.
        env:
          AUTO_SIGN_IN_TOKEN: ${{ steps.mint.outputs.token }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is not set"; exit 1
          fi
          if [ -z "$TRAKT_CLIENT_ID" ]; then
            echo "::error::TRAKT_CLIENT_ID secret is not set"; exit 1
          fi
          flutter build apk --debug \
            --dart-define=AUTO_SIGN_IN_TOKEN="$AUTO_SIGN_IN_TOKEN" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=TRAKT_CLIENT_ID="$TRAKT_CLIENT_ID"

      - name: Boot emulator + capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # Boot-reliability tweaks — rounds 4 + 6 timed out with
          # "Timeout waiting for emulator to boot" / "device not found"
          # (emulator process never came up on the runner). Both are
          # known flakiness modes for this action on GHA ubuntu-latest.
          # Bumping RAM/heap reduces the memory-pressure boot stall;
          # disable-spellchecker + no-metrics trims background work
          # that competes with the boot sequence on a single-core CI
          # VM. boot-timeout is the action's own watchdog — default
          # 600s, set explicit so we can extend without confusion.
          ram-size: 4096M
          heap-size: 512M
          disable-spellchecker: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -no-metrics
          script: |
            mkdir -p screenshots
            # Same 16M logcat ring as screenshots.yml so the post-run
            # diagnostics survive ~60s of capture + Android system noise.
            adb logcat -G 16M
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            # Pre-launch system-dialog suppression — round 1 of this
            # workflow rendered a populated Home screen behind TWO
            # blocking overlays: (a) "Pixel Launcher isn't responding"
            # ANR, (b) the Android 13+ runtime POST_NOTIFICATIONS
            # permission prompt. Fix both before launch so screenshots
            # are clean:
            #
            # 1. Grant POST_NOTIFICATIONS so FCM registration in
            #    notification_service.dart doesn't trigger the prompt.
            #    Granting an unrequested permission is a no-op on
            #    Android < 13 — defence-in-depth, no harm.
            # 2. Disable Pixel Launcher entirely. The launcher only
            #    matters for the home-screen tap UX; we launch via
            #    `am start` directly so the launcher is unused — and
            #    its ANR can't overlay our app if it isn't running.
            #    pm disable-user is reversible and contained to user 0.
            adb shell pm grant com.household.watchnext android.permission.POST_NOTIFICATIONS || true
            # 3. Hide all ANR / crash / app-not-responding dialogs at the
            #    OS level. Both the Pixel Launcher's cold-boot ANR (seen
            #    in rounds 1+2) AND our app's post-sign-in ANR (seen in
            #    round 2: 11 Firestore listeners + 19 TMDB image loads
            #    + 12 OMDb CF calls all firing concurrently saturates
            #    the single-core emulator's main thread for >5s) are
            #    purely cosmetic dialogs on this emulator — the
            #    underlying processes keep running. hide_error_dialogs
            #    suppresses the dialogs system-wide; everything still
            #    works behind them. Round 3 tried disabling the
            #    launcher entirely (pm disable-user) but that broke
            #    Flutter's activity-alias lifecycle in a more subtle
            #    way (main never reached runApp, blank screens). Just
            #    hide the dialogs and let the launcher run.
            adb shell settings put global hide_error_dialogs 1 || true
            # Cold-boot settle time — kept the 10s grace from round 1
            # even though the launcher's now disabled (some system
            # services still finalise indexing in the same window).
            sleep 10
            adb logcat -c
            # Launch via monkey — routes through the launcher's intent
            # resolver, which is the same path the user's home-screen
            # tap takes and works cleanly with our activity-alias setup
            # (gotcha 49). Round 3's `am start -n .../.LauncherClassic`
            # variant broke Flutter's activity lifecycle when the
            # launcher was disabled; with launcher running + monkey
            # launch, round 2 proved this path lands on Home reliably.
            adb shell monkey -p com.household.watchnext -c android.intent.category.LAUNCHER 1
            # Defensive dialog dismiss — if any lingering system dialog
            # slipped through (notification permission on a slow cold
            # boot, e.g.), KEYCODE_BACK closes it without affecting the
            # foreground app.
            sleep 2
            adb shell input keyevent KEYCODE_BACK || true
            # Progressive snapshots so we can see splash → auth-sign-in
            # → /home transitions if the app boots correctly, or pinpoint
            # where it stalls if not. The signInWithCustomToken round
            # trip is typically ~1-2s on a fresh emulator, so by t=10s
            # the app should be settled on Home with the seeded household
            # rendered. The later snapshots give Firestore listeners and
            # TMDB poster loads time to land.
            # Before each screencap, send KEYCODE_BACK to dismiss any
            # system dialog that slipped past hide_error_dialogs.
            # Idempotent + no-op when there's no dialog. Inlined per
            # line because the GHA emulator runner pipes each line to
            # a fresh `sh -c` — shell functions don't carry over
            # between lines (round 3 hit this; cap() not found).
            sleep 3;  adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true; adb exec-out screencap -p > screenshots/01-at-5s.png
            sleep 10; adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true; adb exec-out screencap -p > screenshots/02-at-15s.png
            sleep 15; adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true; adb exec-out screencap -p > screenshots/03-at-30s.png
            sleep 15; adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true; adb exec-out screencap -p > screenshots/04-at-45s.png
            sleep 15; adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true; adb exec-out screencap -p > screenshots/05-at-60s.png
            # Diagnostics bundle — same shape as screenshots.yml so the
            # debugging muscle memory transfers between the two
            # pipelines.
            adb logcat -d > screenshots/logcat.txt 2>&1 || true
            grep -E 'WN_BOOT|WN_ERR|flutter :' screenshots/logcat.txt > screenshots/logcat-app.txt || true
            adb shell ps -A 2>/dev/null | grep -i watchnext > screenshots/app-process.txt || true
            adb shell dumpsys activity activities 2>/dev/null | head -200 > screenshots/dumpsys.txt || true
            ls -la screenshots/
            file screenshots/*.png

      - name: Crop captures to Play-Store-ready 1080×1920 (9:16)
        # Pixel 7 emulator captures at 1080×2400 — too tall for Play
        # Console's [9:16, 16:9] aspect-ratio gate. process_screenshots.py
        # strips the system status bar + nav pill (pure chrome) and
        # bottom-crops to 9:16 while preserving the AppBar + hero
        # content. Writes two variants per capture: 1080×1920 (Play-safe)
        # + 1080×2252 (chrome-trimmed loose variant in case Play accepts
        # the taller frame today). Continues on failure so a bad PNG
        # doesn't kill the artifact upload.
        if: always()
        run: |
          if ls screenshots/*.png >/dev/null 2>&1; then
            python3 -m pip install --quiet Pillow
            python3 scripts/process_screenshots.py screenshots/ --out screenshots/processed/ || \
              echo "::warning::cropper failed — raw captures still in artifact"
          else
            echo "::warning::no PNGs to crop"
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screendingo-screenshots-real
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
