name: screenshots (Play Store)

# Phase 1 — pipeline validation only.
#
# Boots a KVM-accelerated Pixel 8 emulator on a ubuntu-latest runner,
# builds the existing debug APK (no DEMO_MODE yet — we just want to
# capture the login screen as proof the pipeline works), installs it,
# captures one screenshot via `adb exec-out screencap -p`, uploads
# as a workflow artifact.
#
# Phase 2 will add DEMO_MODE to the app and replace this single
# screenshot with a full integration_test-driven sweep that captures
# all 5-8 Play-Store-ready screens with curated mock data.
#
# Why this matters: Google doesn't ship the Android emulator for
# linux_aarch64 (only x64/macOS/Windows), so we can't run this on
# the Oracle arm64 VPS that hosts the rest of our CI thinking. GHA
# ubuntu-latest is x64 with KVM enabled since Feb 2023 explicitly
# for the Android-emulator-on-CI use case.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # upload artifact

    steps:
      - uses: actions/checkout@v4

      # Pre-emulator-run hack: enable KVM on the runner. The
      # reactivecircus action sets this up automatically on most
      # configs but the explicit form is safer + documents the
      # requirement.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write google-services.json (dummy — debug build needs SOMETHING)
        # The debug build references google-services.json at compile
        # time. For the screenshots build we don't actually hit
        # Firebase, but the file must exist for the build to succeed.
        # Write a minimal placeholder rather than carrying the real
        # secret into this workflow (which is intentionally
        # secrets-free so it can be triggered freely).
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "screendingo-demo",
              "storage_bucket": "screendingo-demo.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.household.watchnext" }
              },
              "oauth_client": [{
                "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                "client_type": 3
              }],
              "api_key": [{ "current_key": "AIzaSyDUMMYKEY_FOR_SCREENSHOTS_ONLY" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Generate throwaway debug keystore
        # build.gradle.kts pins debug signing to an in-tree
        # debug.keystore with the standard Android-Studio defaults
        # (alias=androiddebugkey, password=android). The release.yml
        # workflow restores the real one from DEBUG_KEYSTORE_B64 so
        # the SHA-1 matches what's registered in Firebase — but for
        # screenshots we don't sign in to Google, so the cert
        # identity doesn't matter. Generating a fresh keystore with
        # the same alias/password is enough to satisfy
        # validateSigningDebug.
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - run: flutter pub get

      - name: Build debug APK with DEMO_MODE=true
        # DEMO_MODE bypasses Firebase auth + swaps all Firestore-coupled
        # providers for curated mock data (see lib/demo/). TMDB key isn't
        # needed because the demo data layer doesn't make TMDB API calls —
        # TMDB image CDN is public and used directly via poster paths.
        # Trakt key isn't needed because OAuth flow is unreachable in
        # demo mode (Profile/Trakt screen still renders the unlinked
        # state, but the screenshot suite doesn't visit it).
        run: |
          flutter build apk --debug \
            --dart-define=DEMO_MODE=true \
            --dart-define=TMDB_API_KEY=placeholder \
            --dart-define=TRAKT_CLIENT_ID=placeholder

      - name: Boot emulator + capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7  # Pixel 8 not in the AVD device catalog yet; Pixel 7 is the same 1080×2400 screen
          # Headless boot — no UI needed on the CI runner.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          disable-animations: true
          script: |
            mkdir -p screenshots
            # Crank the logcat ring buffer to 16M so the Flutter stack
            # trace + our developer.log diagnostics survive ~40s of
            # captures + Android system noise. Default 256KB was rolling
            # over before the post-run dump could capture our errors.
            adb logcat -G 16M
            # Install the demo-mode APK.
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            # Wait for the system to settle after install — cold-boot
            # launcher needs ~10s to finish indexing apps before it can
            # cleanly resolve an activity launch (previous run hit
            # "Pixel Launcher isn't responding" ANR launching too early).
            sleep 10
            # Clear logcat so the post-run dump only contains app-launch
            # logs, not boot noise.
            adb logcat -c
            # Use `monkey` instead of `am start -n .LauncherClassic` —
            # monkey resolves the default launchable activity through
            # the same path the user's home-screen tap would, avoiding
            # the activity-alias resolution quirk that may have caused
            # the first ANR.
            adb shell monkey -p com.household.watchnext -c android.intent.category.LAUNCHER 1
            # Progressive snapshots so we can see splash → /login →
            # /home transitions if the app boots correctly, or pinpoint
            # where it stalls if not.
            sleep 5;  adb exec-out screencap -p > screenshots/01-at-5s.png
            sleep 10; adb exec-out screencap -p > screenshots/02-at-15s.png
            sleep 10; adb exec-out screencap -p > screenshots/03-at-25s.png
            sleep 15; adb exec-out screencap -p > screenshots/04-at-40s.png
            # Diagnostics — bundled with the screenshots so we can see
            # what the app process actually did. Capture the full buffer
            # (no truncation) AND a flutter-only filtered variant so we
            # don't have to grep through Android system noise.
            adb logcat -d > screenshots/logcat.txt 2>&1 || true
            adb logcat -d *:S flutter:V wn.boot:V wn.errorWidget:V wn.appCheck:V \
              > screenshots/logcat-flutter.txt 2>&1 || true
            adb shell ps -A 2>/dev/null | grep -i watchnext > screenshots/app-process.txt || true
            adb shell dumpsys activity activities 2>/dev/null | head -200 > screenshots/dumpsys.txt || true
            ls -la screenshots/
            file screenshots/*.png

      - name: Upload screenshot artifact
        # Run even if the script step fails — the screenshots + logcat
        # are the entire reason for this workflow. Without `if: always()`
        # one shell failure inside the emulator script means we lose
        # both the captured frames and the diagnostics.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screendingo-screenshots-phase1
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
